name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Java (required by Android SDK / lime) ───────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Android SDK ─────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      # ── Haxe ────────────────────────────────────────────────────────────────
      - name: Set up Haxe 4.3.4
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      # ── Cache haxelib ────────────────────────────────────────────────────────
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('hmm.json') }}-v2
          restore-keys: |
            haxelib-${{ runner.os }}-

      # ── Bootstrap haxelib & install hmm ─────────────────────────────────────
      - name: Set up haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          # Force git to fetch everything properly if it encounters issues
          git config --global core.compression 0
          haxelib run hmm install

      # ── Configure lime for Android ───────────────────────────────────────────
      - name: Configure lime Android paths
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime setup android -nocolor

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build (release)
        run: haxelib run lime build android -release -nocolor

      # ── Upload APK artifact ──────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-android-${{ github.sha }}
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
